<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考公脑库 · 间隔重复学习系统</title>
<meta name="kg-app-ver" content="20261023a">
<script>
(function(){
  try{
    var t=localStorage.getItem('kg_theme')||'dark';
    var real=t;
    if(t==='auto'){ real=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'; }
    document.documentElement.setAttribute('data-theme',real);
    var fs=localStorage.getItem('kg_fontscale'); if(fs) document.documentElement.style.fontSize=fs+'px';
    if(localStorage.getItem('kg_focus')==='1') document.documentElement.setAttribute('data-focus','1');
  }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();
</script>
<link rel="stylesheet" href="/static/style.css?v=20261023a">
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div class="brand-row">
      <div class="brand">📚 考公脑库<small>记忆曲线刷题系统</small></div>
      <div class="top-actions">
        <button id="user-name" class="user-chip" title="点击切换 / 新建账号">未登录</button>
        <button id="theme-toggle" class="theme-btn" title="切换主题（暗/亮/跟随系统）">☀️</button>
      </div>
    </div>
    <nav id="nav">
      <a href="#/">总览面板</a>
      <a href="#/study">开始练习</a>
      <a href="#/review">复习到期</a>
      <a href="#/wrongbook">错题本</a>
      <a href="#/favorites">我的收藏</a>
      <a href="#/exam">模拟考试</a>
      <a href="#/browse">真题浏览</a>
      <a href="#/search">全文搜索</a>
      <a href="#/kadian">考点导航</a>
      <a href="#/materials">材料组题</a>
      <a href="#/doubts">疑点复核</a>
      <a href="#/stats">数据统计</a>
      <a href="#/settings">设置</a>
    </nav>
    <div id="side-stats"></div>
  </aside>
  <main id="app"><div class="loading">加载中…</div></main>
  <button id="focus-exit" class="focus-exit" title="退出专注模式">专注模式 · 点击退出</button>
</div>
<script src="/static/app.js?v=20261023a"></script>
<script>
/* 兜底自救：8 秒后主区域仍是"加载中…"（旧版本缓存 / 脚本异常导致），
   就给出一键强制加载最新版的入口，避免页面永远卡在加载状态。 */
setTimeout(function () {
  try {
    /* 只在前端确实没启动起来时才提示。
       以前是无条件替换 #app：机器慢 / 题库大时 /api/stats 还没回来（.loading 仍在），
       8 秒一到就把正在加载的页面整个换掉，反而制造了"打不开"。 */
    if (window.__kgBooted) return;
    if (document.querySelector('.modal-mask') || document.getElementById('lg-user')) return;
    var a = document.getElementById('app');
    if (!a || !a.querySelector('.loading')) return;
    if (document.getElementById('kg-slow-tip')) return;
    var bar = document.createElement('div');
    bar.id = 'kg-slow-tip';
    bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;'
      + 'display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;'
      + 'background:rgba(28,28,30,.92);color:#fff;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.28)';
    bar.innerHTML = '<span>加载较慢…如果长时间没反应，可强制刷新</span>'
      + '<button id="kg-rescue" style="padding:6px 12px;border-radius:8px;border:0;cursor:pointer;'
      + 'background:#2EA043;color:#fff;font-size:13px">强制加载最新版本</button>';
    document.body.appendChild(bar);
    document.getElementById('kg-rescue').onclick = function () {
      location.replace('/index.html?v=20261023a&t=' + Date.now());
    };
  } catch (e) { }
}, 15000);
</script>
</body>
</html>
